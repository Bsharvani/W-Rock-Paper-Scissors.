<!DOCTYPE html>
<html lang="en">
<head>
 <meta charset="UTF-8">
 <title>Rock Paper Scissors</title>
 <meta name="viewport" content="width=device-width, initial-scale=1">
 <link rel="stylesheet" href="style.css">
</head>
<body>

 <div id="loading" style="display: none;">
 <h1>🎮 Welcome to My Game</h1>
 <h2>✊ ✋ ✌️</h2>
 <div class="loader"></div>
 <h3>Loading... Please Wait</h3>
 </div>

 <div id="game">
 <h1>✊ Rock Paper Scissors ✌️</h1>
 <h3>Choose Your Game Mode</h3>

 <div class="mode">
 <button onclick="setMode('two')">👥 Two Players</button>
 <button onclick="setMode('computer')">🤖 Play With Computer</button>
 </div>

 <h2 id="modeTitle">🤖 Mode: Play With Computer</h2>

 <div class="scoreboard">
 <div class="score-card">
 <h3>👤 Player 1</h3>
 <h1 id="score1">0</h1>
 </div>
 <div class="score-card" id="opponentScoreCard">
 <h3 id="opponentTitle">🤖 Computer</h3>
 <h1 id="score2">0</h1>
 </div>
 <div class="score-card">
 <h3>🤝 Draws</h3>
 <h1 id="draws">0</h1>
 </div>
 </div>

 <h2 id="round">🎲 Round: 0</h2>

 <div class="player">
 <h2>👤 Player 1</h2>
 <button onclick="selectChoice(1, 'rock')">✊ Rock</button>
 <button onclick="selectChoice(1, 'paper')">✋ Paper</button>
 <button onclick="selectChoice(1, 'scissors')">✌️ Scissors</button>
 </div>

 <div class="player" id="player2Controls" style="display: none;">
 <h2>👥 Player 2</h2>
 <button onclick="selectChoice(2, 'rock')">✊ Rock</button>
 <button onclick="selectChoice(2, 'paper')">✋ Paper</button>
 <button onclick="selectChoice(2, 'scissors')">✌️ Scissors</button>
 </div>

 <div id="statusArea">
 <p id="player1Choice">👤 Player 1: ⏳ Waiting...</p>
 <p id="player2Choice">🤖 Computer: ⏳ Waiting...</p>
 <h3 id="result">🎮 Make a move to start!</h3>
 </div>

 <button onclick="restartGame()">🔄 Restart Game</button>
 </div>

 <script>
 let mode = "computer";
 let player1 = "";
 let player2 = "";
 let waiting = false;

 const EMOJIS = {
 } else if (playerNum === 2 && mode === "two") {
 player2 = choice;
 document.getElementById("player2Choice").innerHTML =
 "👥 Player 2: 🔒 Selected";
 if (player1) {
 playRound();
 }
 }
 }

 function evaluateLocalRound(p1, p2) {
 localState.round += 1;
 const oppEmoji = mode === "two" ? "👥" : "🤖";
 const oppName = mode === "two" ? "Player 2" : "Computer";
 let resultText = "";

 if (p1 === p2) {
 localState.draws += 1;
 resultText = `🤝 It's a Draw! ${EMOJIS[p1] || ""} vs ${EMOJIS[p2] || ""}`;
 } else if (
 (p1 === "rock" && p2 === "scissors") ||
 (p1 === "paper" && p2 === "rock") ||
 (p1 === "scissors" && p2 === "paper")
 ) {
 localState.player1_score += 1;
 resultText = `🎉 Player 1 Wins! ${EMOJIS[p1]} beats ${EMOJIS[p2]}`;
 } else {
 if (mode === "two") localState.player2_score += 1;
 else localState.computer_score += 1;
 resultText = `${oppEmoji} ${oppName} Wins! ${EMOJIS[p2]} beats ${EMOJIS[p1]}`;
 }

 return {
 player1: p1,
 player2: p2,
 opponent_name: oppName,
 result: resultText,
 player1_score: localState.player1_score,
 player2_score: localState.player2_score,
 computer_score: localState.computer_score,
 draws: localState.draws,
 round: localState.round
 };
 }

 async function playRound() {
 waiting = true;
 try {
 let data;
 try {
 const response = await fetch("/play", {
 method: "POST",
 headers: { "Content-Type": "application/json" },
 body: JSON.stringify({
 mode: mode,
 player1: player1,
 player2: player2
 })
 });
 if (!response.ok) {
 throw new Error("Server returned " + response.status);
 }
 data = await response.json();
 } catch (_networkErr) {
 data = evaluateLocalRound(player1, player2);
 }

 const oppEmoji = mode === "two" ? "👥" : "🤖";
 const oppName = data.opponent_name || (mode === "two" ? "Player 2" : "Computer");

 document.getElementById("player1Choice").innerHTML =
 `👤 Player 1: ${formatChoice(data.player1)}`;
 document.getElementById("player2Choice").innerHTML =
 `${oppEmoji} ${oppName}: ${formatChoice(data.player2)}`;
 document.getElementById("result").innerHTML = data.result;
 document.getElementById("score1").innerHTML = data.player1_score;
 document.getElementById("score2").innerHTML =
 mode === "two" ? data.player2_score : data.computer_score;
 document.getElementById("draws").innerHTML = data.draws;
 document.getElementById("round").innerHTML = `🎲 Round: ${data.round}`;
 } catch (error) {
 document.getElementById("result").innerHTML = `⚠️ ${error.message}`;
 } finally {
 player1 = "";
 player2 = "";
 waiting = false;
 }
 }

 async function restartGame() {
 try {
 await fetch("/restart", { method: "POST" }).catch(() => {});
 player1 = "";
 player2 = "";
 waiting = false;
 localState = { round: 0, player1_score: 0, player2_score: 0, computer_score: 0, draws: 0 };

 const oppEmoji = mode === "two" ? "👥" : "🤖";
 const oppName = mode === "two" ? "Player 2" : "Computer";

 document.getElementById("score1").innerHTML = "0";
 document.getElementById("score2").innerHTML = "0";
 document.getElementById("draws").innerHTML = "0";
 document.getElementById("round").innerHTML = "🎲 Round: 0";
 document.getElementById("player1Choice").innerHTML = "👤 Player 1: ⏳ Waiting...";
 document.getElementById("player2Choice").innerHTML = `${oppEmoji} ${oppName}: ⏳ Waiting...`;
 document.getElementById("result").innerHTML = "🔄 Game Restarted! 🎮";
 } catch (error) {
 document.getElementById("result").innerHTML = `⚠️ ${error.message}`;
 }
 }
 </script>
</body>
</html>
